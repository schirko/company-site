<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title}</title>
  <meta name="description" content="${description}">
  ${robots}
  <link rel="canonical" href="${canonical}">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="brand/icon-180.png">
  <link rel="stylesheet" href="suite/suite.css">
  <link rel="stylesheet" href="site.css">
</head>
<body>
<header class="suite-bar site-header">
  <div class="wrap header-row">
    <a class="suite-name wordmark" href="index.html"><img src="brand/wordmark-dark.svg" alt="${name}" width="230" height="36"></a>
    <nav class="site-nav" aria-label="Site">
      <a href="index.html#our-apps">Our Farm Apps</a>
      <a href="barns.html"${nav_barns}>Barn Prices</a>
      <a href="about.html"${nav_about}>About</a>
      <a href="methods.html"${nav_methods}>How We Test</a>
      <a href="privacy.html"${nav_privacy}>Privacy</a>
      <a class="nav-signin" href="${account_url}">Sign In</a>
      <details class="suite-apps" data-suite-apps="company-site" data-suite-base="suite"></details>
    </nav>
  </div>
</header>

<main>
${body}
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <p class="footer-name"><img src="brand/wordmark-dark.svg" alt="${name}" width="179" height="28"></p>
      <p>${tagline}. ${location}.</p>
    </div>
    <nav aria-label="Apps" class="footer-col">
      <h2>Apps</h2>
${footer_apps}
    </nav>
    <nav aria-label="Company" class="footer-col">
      <h2>Company</h2>
      <a href="about.html">About</a>
      <a href="methods.html">How We Test</a>
      <a href="privacy.html">Privacy</a>
${footer_contact}
    </nav>
  </div>
  <div class="footer-bottom">
    <p>&copy; ${year} ${name}. We never sell or rent your email address or your records.</p>
  </div>
</footer>
<script src="suite/suite.js" defer></script>
</body>
</html>
