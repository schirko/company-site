# Every Friday: pick this week's farm county, ask Herd Planner for this week's steer price,
# rebuild the site with the new numbers, check it, and publish it (GitHub Pages serves docs/).
# Free: public repositories get GitHub Actions minutes at no cost.
# Run it by hand any time: GitHub > Actions > Weekly stat cards > Run workflow.
name: Weekly stat cards

on:
  schedule:
    - cron: "17 13 * * 5"  # Fridays 13:17 UTC = 7:17 am in Denver (6:17 am in winter)
  workflow_dispatch:

permissions:
  contents: write  # to commit the new week

concurrency:
  group: weekly-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The branch as it is right now, not the commit the run started from: so "Re-run" works too.
      - uses: actions/checkout@v5.0.0
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Tests first: they build into a scratch folder, so they never leave test numbers in docs/.
      - run: pytest
      # If someone pushes while this runs (you pushing site changes, say), the push is refused.
      # Then start again from the newest commit: fetch it, redo the week, try again (up to 3 times).
      # Safe to repeat: cards.py replaces this week's numbers instead of adding a second copy.
      - name: Refresh, build and publish the new week
        run: |
          git config user.name "weekly-cards bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            python cards.py refresh
            python build.py
            git add content/cards docs
            if git diff --cached --quiet; then
              echo "Nothing changed."
              exit 0
            fi
            git commit -m "Weekly stat cards: $(date -u +%G-W%V)"
            if git push; then
              exit 0
            fi
            echo "Someone pushed while this ran. Starting again from the newest commit (try $attempt of 3)."
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
          done
          exit 1
